[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/fill", "crates/llm", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/marcus-saito/perch"

[workspace.dependencies]
perch-core = { path = "crates/core" }
perch-fill = { path = "crates/fill" }
perch-llm = { path = "crates/llm" }

anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
directories = "6"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
toml = "1.1"
url = "2"

[profile.release]
strip = true
lto = "thin"
