# Known vulnerabilities in what Perch depends on. Runs when a lockfile changes
# and once a week regardless, because an advisory can land with no change here.
#
# cargo audit is run directly rather than through an action. The action files
# one GitHub issue per informational warning on every scheduled run, and the
# warnings here are unmaintained crates inside Tauri and the PDF reader that
# Perch cannot replace. A real vulnerability fails this run, which is the
# signal that matters; a warning is printed and nothing more.
name: audit

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - app/package-lock.json
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - app/package-lock.json
      - .github/workflows/audit.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: No dependency carries a known vulnerability
        run: cargo audit

  npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The app's runtime dependencies carry no known high or critical advisory
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
