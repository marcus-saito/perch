[package]
name = "perch-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "perch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
perch-core.workspace = true
perch-fill.workspace = true
perch-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
# The ACL decides whether the sheet can hear a report at all, and it is
# resolved by the real IPC path rather than by the file it is written in.
tauri = { version = "2", features = ["test"] }
